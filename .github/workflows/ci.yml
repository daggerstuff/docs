name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint & Style Check (Ruff)
        run: |
          ruff check linear-audit tests
          ruff format --check linear-audit tests

      - name: Security SAST Audit (Bandit)
        run: bandit -c pyproject.toml -r linear-audit

      - name: Test Suite & Data Contracts (Pytest)
        run: pytest -v --cov=linear-audit --cov-report=term-missing