[project]
name = "docs-linear-audit"
version = "0.1.0"
description = "Linear workspace audit and data engineering toolkit for the Pixelated Empathy docs repo"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pixelated Empathy Team" }]
dependencies = [
    "requests>=2.32.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "bandit>=1.7.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linear-audit"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"

[tool.coverage.run]
source = ["linear-audit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]